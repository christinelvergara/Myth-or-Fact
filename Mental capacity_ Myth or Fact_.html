<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mental capacity: Myth or Fact?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#2a2118;--muted:#6f6254;--bark:#6b3a12;--myth:#b3261e;--fact:#2f6b45;--line:#e2d8ca;--forest:#20382b;--onforest:#f6f1ea;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#221c16;--ink:#f1e9de;--muted:#b3a597;--bark:#d4a373;--myth:#f2877f;--fact:#7fcf9c;--line:#3a3128;--forest:#0f1f17;--onforest:#f1e9de;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--card:#221c16;--ink:#f1e9de;--muted:#b3a597;--bark:#d4a373;--myth:#f2877f;--fact:#7fcf9c;--line:#3a3128;--forest:#0f1f17;--onforest:#f1e9de;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.55;min-height:100vh}
.bar{background:var(--forest);color:var(--onforest);padding:10px 24px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tile{background:#fffdf9;border-radius:12px;padding:6px 14px;display:flex}
.tile img{height:104px;width:auto;display:block}
.bar small{display:block;opacity:.8;font-weight:400;font-size:13px}
main{max-width:720px;margin:0 auto;padding:32px 20px 56px}
h1,h2,.q{font-family:Fraunces,Georgia,"Times New Roman",serif;color:var(--bark);margin:0}
h1{font-size:clamp(34px,7vw,56px);line-height:1.08;font-weight:700}
h1 em{font-style:italic;font-weight:600}
.lede{color:var(--muted);max-width:52ch;margin:20px 0 32px}
.dots{display:flex;gap:8px;margin-bottom:24px}
.dot{height:8px;flex:1;border-radius:4px;background:var(--line)}
.dot.done{background:var(--bark)}.dot.now{background:var(--muted)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px 36px;overflow:hidden}
.count{color:var(--muted);font-size:15px;margin:0 0 14px}
.q{font-size:clamp(23px,4.4vw,32px);line-height:1.28;font-weight:500}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.btn{font:inherit;font-weight:700;font-size:22px;letter-spacing:.04em;padding:18px 12px;border-radius:10px;background:transparent;cursor:pointer;border:3px solid currentColor;transition:transform .12s,background .15s}
.btn.myth{color:var(--myth)}.btn.fact{color:var(--fact)}
.btn:hover:not(:disabled){transform:translateY(-2px);background:color-mix(in srgb,currentColor 9%,transparent)}
.btn:focus-visible,.go:focus-visible,input:focus-visible{outline:3px solid var(--bark);outline-offset:3px}
.btn:disabled{cursor:default;opacity:.35}
.btn.picked{opacity:1;background:color-mix(in srgb,currentColor 14%,transparent)}
.stamp{position:absolute;right:22px;top:22px;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:34px;letter-spacing:.06em;padding:4px 16px;border:4px solid currentColor;border-radius:8px;transform:rotate(-9deg);opacity:.9;animation:slam .35s cubic-bezier(.2,1.4,.4,1)}
.stamp.myth{color:var(--myth)}.stamp.fact{color:var(--fact)}
@keyframes slam{from{transform:rotate(-9deg) scale(2);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:.9}}
.fb{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.verdict{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:700;margin:0 0 6px}
.verdict.ok{color:var(--fact)}.verdict.no{color:var(--myth)}
.fb p{margin:0 0 14px;max-width:62ch}
.fb p.cite{font-size:14px;color:var(--muted);margin-bottom:22px}
.go{font:inherit;font-weight:700;background:var(--forest);color:var(--onforest);border:0;border-radius:999px;padding:14px 30px;cursor:pointer}
.go:hover{filter:brightness(1.15)}.go:disabled{opacity:.5;cursor:default}
.score{font-family:Fraunces,Georgia,serif;font-size:clamp(72px,18vw,128px);line-height:1;color:var(--bark);font-weight:700;margin:8px 0 4px}
.score small{font-size:.35em;color:var(--muted);font-weight:500}
.lead{margin:28px 0;padding:24px 22px;border-left:5px solid var(--fact);background:var(--card);border-radius:0 14px 14px 0}
.lead h2{font-size:24px;margin-bottom:6px}.lead p{margin:0 0 16px}
.lead label{display:block;font-weight:600;font-size:15px;margin:12px 0 4px}
.lead input{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.lead .go{margin-top:18px}
.links{display:flex;gap:12px;flex-wrap:wrap}.links a{display:inline-block;text-decoration:none;margin:0}
.note{font-size:14px;color:var(--muted);margin:12px 0 0!important}
.ok-msg{font-weight:600;color:var(--fact);margin:0!important}
.refs{margin:0 0 28px;border-top:1px solid var(--line);padding-top:16px}
.refs summary{cursor:pointer;font-weight:600;color:var(--bark)}
.refs ol{padding-left:22px;font-size:15px;color:var(--muted)}
.refs li{margin:10px 0;padding-left:4px;text-indent:0}
.refs a{color:inherit;word-break:break-all}
@media (max-width:480px){.choices{grid-template-columns:1fr}.stamp{font-size:26px;right:14px;top:14px}.card{padding:26px 20px 30px}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.btn{transition:none}}
</style>
</head>

<main id="app"></main>
<script>
const Q=[
{s:"Having a mental health condition means a person lacks mental capacity.",a:"myth",
e:"A mental health diagnosis does not automatically indicate a lack of mental capacity. A person may experience mental health difficulties while retaining the capacity to make informed decisions.",
c:"Mental Capacity Act 2008, ss 3(2), 4(1), 4(3)"},
{s:"A person who lacks mental capacity to make decisions about their personal welfare will also lack capacity to manage their financial affairs.",a:"myth",
e:"Mental capacity is decision-specific and time-specific. An individual may lack capacity to make certain personal welfare decisions while retaining capacity to manage financial matters, or vice versa. Capacity must therefore be assessed separately for each decision, rather than inferred from an assessment in another domain.",
c:"Mental Capacity Act 2008, s 4(1); Lim et al. (2026), p. 431"},
{s:"A person who needs help understanding information lacks mental capacity.",a:"myth",
e:"Requiring assistance to understand information does not necessarily indicate a lack of mental capacity. Appropriate support, such as simplified explanations, visual aids or alternative communication methods, can facilitate understanding and help individuals demonstrate their decision-making abilities. The need for such support does not, by itself, establish incapacity.",
c:"Mental Capacity Act 2008, ss 3(3), 5(2); Tan (2019), p. 12"},
{s:"Having a good memory is usually sufficient to establish that someone has mental capacity.",a:"myth",
e:"Memory alone does not determine mental capacity. Mental capacity also considers whether an individual can understand, retain, use or weigh relevant information, and communicate their decision. An individual may have intact memory but still experience difficulties evaluating options and understanding the consequences of a decision.",
c:"Mental Capacity Act 2008, s 5(1); Lim et al. (2026), p. 430"},
{s:"A person who has been assessed to lack mental capacity may subsequently regain it.",a:"fact",
e:"Mental capacity can fluctuate or improve over time, depending on the underlying condition. For instance, individuals experiencing temporary cognitive impairment due to delirium, acute illness or other reversible conditions may regain their decision-making abilities following recovery. Capacity must therefore be assessed in relation to the specific decision and at the relevant time, rather than assuming that a previous finding of incapacity is permanent.",
c:"Mental Capacity Act 2008, s 4(1); Lim et al. (2026), pp. 431, 433"},
{s:"Certification of mental capacity for a Lasting Power of Attorney (LPA) and a mental capacity assessment conducted by a psychologist serve the same purpose.",a:"myth",
e:"While both involve evaluating an individual’s decision-making abilities, they serve distinct professional and legal functions. LPA certification is a statutory process conducted by an authorised Certificate Issuer to confirm that the donor understands the LPA and is making it voluntarily. Psychological assessments provide a more detailed evaluation of cognitive functioning and decision-making abilities, which may inform clinical and legal opinions but do not replace formal LPA certification.",
c:"Mental Capacity Act 2008, First Schedule, para 2(1)(e); Office of the Public Guardian (n.d.), paras 2.1–2.2; Lim et al. (2026), pp. 430–432"}
];
const app=document.getElementById("app");
let i=0,score=0;
const dots=()=>`<div class="dots" aria-hidden="true">${Q.map((_,k)=>`<div class="dot ${k<i?"done":k===i?"now":""}"></div>`).join("")}</div>`;
function start(){i=0;score=0;app.innerHTML=`<h1>Mental capacity, LPA and mental health: <em>Myth or Fact?</em></h1>
<p class="lede">Six statements about mental capacity. Decide whether each one is a myth or a fact, then read why. Your score appears at the end.</p>
<button class="go" id="begin">Start the quiz</button>`;
document.getElementById("begin").onclick=show;scrollTo(0,0)}
function show(){const q=Q[i];
app.innerHTML=`${dots()}<section class="card" id="card"><p class="count">Question ${i+1} of ${Q.length}</p>
<h2 class="q">${q.s}</h2>
<div class="choices"><button class="btn myth" data-v="myth">MYTH</button><button class="btn fact" data-v="fact">FACT</button></div>
<div id="out" aria-live="polite"></div></section>`;
app.querySelectorAll(".btn").forEach(b=>b.onclick=()=>answer(b.dataset.v))}
function answer(v){const q=Q[i],ok=v===q.a;if(ok)score++;
app.querySelectorAll(".btn").forEach(b=>{b.disabled=true;if(b.dataset.v===v)b.classList.add("picked")});
document.getElementById("card").insertAdjacentHTML("afterbegin",`<div class="stamp ${q.a}">${q.a.toUpperCase()}</div>`);
document.getElementById("out").innerHTML=`<div class="fb"><p class="verdict ${ok?"ok":"no"}">${ok?"Correct.":"Not quite."} This one is a ${q.a}.</p><p>${q.e}</p><p class="cite">${q.c}</p><button class="go" id="next">${i<Q.length-1?"Next question":"See my score"}</button></div>`;
const n=document.getElementById("next");n.onclick=()=>{i++;i<Q.length?show():finish()};n.focus()}
function finish(){i=Q.length;
const m="Thanks for taking part.";
app.innerHTML=`${dots()}<h1>You scored</h1><div class="score">${score}<small> out of 6</small></div><p class="lede">${m}</p>
<div class="lead"><h2>Interested in learning more?</h2><p>Find out more about Lasting Power of Attorney certification and mental capacity assessments at Annabelle Psychology.</p><div class="links"><a class="go" href="https://www.annabellepsychology.com/lasting-power-of-attonery-lpa" target="_blank" rel="noopener">LPA</a><a class="go" href="https://www.annabellepsychology.com/medicolegal" target="_blank" rel="noopener">Mental capacity assessments</a></div></div>
<details class="refs"><summary>References</summary><ol>
<li>Lim, M., Tan, L., &amp; Yeo, D. (2026). Enhancing the mental capacity assessment process: A community psychology perspective. <em>Psychiatry, Psychology and Law, 33</em>(2), 430–442. <a href="https://doi.org/10.1080/13218719.2024.2444297">https://doi.org/10.1080/13218719.2024.2444297</a></li>
<li>Tan, T. L. (2019). Mental capacity assessment (an update): Lasting power of attorney certification and court appointed deputy application for patients. <em>The Singapore Family Physician, 45</em>(3), 11–17.</li>
<li>Mental Capacity Act 2008 (2020 Rev. Ed.) (Singapore). <a href="https://sso.agc.gov.sg/Act/MCA2008">https://sso.agc.gov.sg/Act/MCA2008</a></li>
<li>Office of the Public Guardian. (n.d.). <em>Lasting power of attorney certificate issuer guide</em>. Ministry of Social and Family Development. <a href="https://www.msf.gov.sg/docs/default-source/opg/lpa_certificate_issuer_guide.pdf">https://www.msf.gov.sg/docs/default-source/opg/lpa_certificate_issuer_guide.pdf</a></li></ol></details>
<button class="go" id="again">Next player</button>`;
document.getElementById("again").onclick=start;
scrollTo(0,0)}
start();
</script>
